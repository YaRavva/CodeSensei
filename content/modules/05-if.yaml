id: m05_if
topic: Программа принимает решения — выполняет код только при нужном условии.
theory: |
  До сих пор программа выполняла все команды подряд. Условие позволяет выполнить команду, **только если** что-то верно, а иначе — другую команду.

  ## Сравнения

  Сравнение даёт ответ `True` (верно) или `False` (неверно).

  | Знак | Значение |
  |---|---|
  | `==` | равно |
  | `!=` | не равно |
  | `<`, `>` | меньше, больше |
  | `<=`, `>=` | меньше или равно, больше или равно |

  ```python
  age = 14
  print(age >= 12)
  print(age == 15)
  ```

  Результат:

  ```text
  True
  False
  ```

  Не путайте: `=` кладёт значение в переменную, `==` сравнивает.

  ## Оператор if

  Команды внутри `if` выполняются, только если условие верно. После условия ставят двоеточие, а команды внутри сдвигают на 4 пробела — это **отступ**.

  ```python
  temperature = 30
  if temperature > 25:
      print("Жарко!")
  print("Прогноз готов")
  ```

  Результат:

  ```text
  Жарко!
  Прогноз готов
  ```

  Последний `print()` без отступа — он выполняется всегда.

  ## if и else

  `else` — «иначе»: эти команды выполняются, когда условие неверно.

  ```python
  n = 7
  if n % 2 == 0:
      print("чётное")
  else:
      print("нечётное")
  ```

  Результат:

  ```text
  нечётное
  ```

  Число чётное, если остаток от деления на 2 равен нулю: `n % 2 == 0`.

  ## Условие внутри условия

  Внутри `if` можно написать ещё один `if` — с ещё большим отступом.

  ```python
  has_ticket = "да"
  age = 10
  if has_ticket == "да":
      if age >= 12:
          print("Проходите")
      else:
          print("Нужен взрослый")
  else:
      print("Купите билет")
  ```

  Результат:

  ```text
  Нужен взрослый
  ```

  ## Частые ошибки

  - Нет двоеточия после условия — `SyntaxError`.
  - Нет отступа внутри `if` — `IndentationError`.
  - `if x = 5:` вместо `if x == 5:`.
tasks:
  - slug: t1
    title: Чётное или нечётное
    difficulty: easy
    mode: stdout
    description: |
      Выведите `чётное`, если число `n` чётное, и `нечётное` — если нет.

      **Что уже есть:** переменная `n`.

      **Пример:** при `n = 7` вывод:

      ```text
      нечётное
      ```

      **Как проверим:** подставим чётные и нечётные числа, в том числе 0.
    starter: |
      n = 7  # при проверке подставим другое число
      # Выведите «чётное» или «нечётное»
    solution: |
      if n % 2 == 0:
          print("чётное")
      else:
          print("нечётное")
    hints:
      - Чему равен остаток от деления чётного числа на 2?
      - Проверьте условие n % 2 == 0 в if, а второй вариант напишите в else.
      - 'Проверка делимости на 3: if n % 3 == 0: print("делится")'
    tests:
      - description: Число 7
        input: { n: 7 }
        expected: нечётное
        visible: true
      - description: Число 10
        input: { n: 10 }
        expected: чётное
      - description: Ноль
        input: { n: 0 }
        expected: чётное

  - slug: t2
    title: Фильм 12+
    difficulty: easy
    mode: stdout
    description: |
      На фильм пускают с 12 лет. Выведите `Проходите`, если `age` не меньше 12, иначе — `Фильм 12+`.

      **Что уже есть:** переменная `age`.

      **Пример:** при `age = 14` вывод:

      ```text
      Проходите
      ```

      **Как проверим:** подставим возраст меньше, больше и ровно 12.
    starter: |
      age = 14  # при проверке подставим другой возраст
      # Пропустите зрителя или выведите «Фильм 12+»
    solution: |
      if age >= 12:
          print("Проходите")
      else:
          print("Фильм 12+")
    hints:
      - Пускают ли зрителя, которому ровно 12 лет? Какой знак сравнения это учитывает?
      - Нужно условие age >= 12, а вариант для младших — в else.
      - 'Пример: if score >= 50: print("Зачёт") else: print("Пересдача")'
    tests:
      - description: 14 лет
        input: { age: 14 }
        expected: Проходите
        visible: true
      - description: Ровно 12
        input: { age: 12 }
        expected: Проходите
      - description: 9 лет
        input: { age: 9 }
        expected: Фильм 12+

  - slug: t3
    title: Большее из двух
    difficulty: medium
    mode: stdout
    description: |
      Выведите большее из чисел `a` и `b`. Если числа равны, выведите любое из них.

      **Что уже есть:** переменные `a` и `b`.

      **Пример:** при `a = 3`, `b = 8` вывод:

      ```text
      8
      ```

      **Как проверим:** подставим разные пары, в том числе равные и отрицательные.
    starter: |
      a = 3  # при проверке подставим другие числа
      b = 8
      # Выведите большее число
    solution: |
      if a > b:
          print(a)
      else:
          print(b)
    hints:
      - Что нужно сравнить, чтобы понять, какое число выводить?
      - Если a > b — выводим a, иначе — b. Для равных чисел подойдёт ветка else.
      - 'Меньшее из двух: if x < y: print(x) else: print(y)'
    tests:
      - description: 3 и 8
        input: { a: 3, b: 8 }
        expected: 8
        visible: true
      - description: Первое больше
        input: { a: 10, b: -2 }
        expected: 10
      - description: Равные числа
        input: { a: 5, b: 5 }
        expected: 5

  - slug: t4
    title: Скидка от 1000 рублей
    difficulty: medium
    mode: stdout
    description: |
      Если сумма покупки `total` не меньше 1000 рублей, магазин даёт скидку 10% (сумма уменьшается на `total // 10`). Выведите сумму к оплате.

      **Что уже есть:** переменная `total` — целое число.

      **Пример:** при `total = 1500` вывод:

      ```text
      1350
      ```

      **Как проверим:** подставим суммы больше, меньше и ровно 1000.
    starter: |
      total = 1500  # при проверке подставим другую сумму
      # Примените скидку, если нужно, и выведите сумму
    solution: |
      if total >= 1000:
          total = total - total // 10
      print(total)
    hints:
      - При каком условии сумма меняется, а при каком остаётся прежней?
      - Внутри if уменьшите total на total // 10, а print() напишите без отступа — он нужен в обоих случаях.
      - 'Пример: if score > 100: score = 100, затем print(score)'
    tests:
      - description: 1500 рублей
        input: { total: 1500 }
        expected: 1350
        visible: true
      - description: Без скидки
        input: { total: 800 }
        expected: 800
      - description: Ровно 1000
        input: { total: 1000 }
        expected: 900

  - slug: t5
    title: Проверка пароля
    difficulty: hard
    mode: stdout
    description: |
      При регистрации пароль вводят дважды. Если пароли не совпадают, выведите `Пароли не совпадают`. Если совпадают, но пароль короче 8 символов, выведите `Слишком короткий`, иначе — `Пароль сохранён`.

      **Что уже есть:** переменные `password` и `repeat`.

      **Пример:** при `password = "qwerty123"`, `repeat = "qwerty123"` вывод:

      ```text
      Пароль сохранён
      ```

      **Как проверим:** подставим совпадающие и разные пароли разной длины.
    starter: |
      password = "qwerty123"  # при проверке подставим другие значения
      repeat = "qwerty123"
      # Проверьте совпадение, затем длину
    solution: |
      if password == repeat:
          if len(password) >= 8:
              print("Пароль сохранён")
          else:
              print("Слишком короткий")
      else:
          print("Пароли не совпадают")
    hints:
      - Какую проверку нужно сделать первой и когда вообще имеет смысл проверять длину?
      - Сначала if password == repeat. Внутри него — второй if для длины через len(). Несовпадение — во внешнем else.
      - 'Похожая схема: if has_ticket == "да": (внутри if age >= 12 … else …) else: print("Купите билет")'
    tests:
      - description: Хороший пароль
        input: { password: qwerty123, repeat: qwerty123 }
        expected: Пароль сохранён
        visible: true
      - description: Короткий пароль
        input: { password: cat, repeat: cat }
        expected: Слишком короткий
      - description: Не совпадают
        input: { password: qwerty123, repeat: qwerty124 }
        expected: Пароли не совпадают
      - description: Ровно 8 символов
        input: { password: abcdefgh, repeat: abcdefgh }
        expected: Пароль сохранён
