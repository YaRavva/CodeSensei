id: m08_for
topic: Повторяем действие нужное число раз и перебираем символы строки.
theory: |
  Цикл `for` перебирает значения по очереди: числа из `range()` или символы строки. Он удобен, когда заранее известно, сколько раз повторять.

  ## for и range()

  `range(n)` — числа от 0 до `n - 1`. `range(a, b)` — от `a` до `b - 1`. `range(a, b, step)` — с шагом `step`.

  ```python
  for i in range(3):
      print("Повтор", i)
  for x in range(2, 11, 4):
      print(x)
  ```

  Результат:

  ```text
  Повтор 0
  Повтор 1
  Повтор 2
  2
  6
  10
  ```

  Правая граница в `range()` **не входит**: чтобы получить числа до `n` включительно, пишут `range(1, n + 1)`.

  ## Перебор строки

  `for` может пройти по каждому символу строки.

  ```python
  for letter in "кот":
      print(letter)
  ```

  Результат:

  ```text
  к
  о
  т
  ```

  ## Накопление результата

  Как и с `while`: переменная до цикла, обновление в цикле, ответ после цикла.

  ```python
  total = 0
  for i in range(1, 6):
      total += i
  print(total)
  ```

  Результат:

  ```text
  15
  ```

  ## Переменная result

  С этого модуля в некоторых заданиях ответ нужно не выводить, а **записать в переменную `result`** — проверка посмотрит её значение.

  ```python
  word = "мама"
  count = 0
  for letter in word:
      if letter == "м":
          count += 1
  result = count
  print(result)
  ```

  Результат:

  ```text
  2
  ```

  ## for или while?

  - Известно число повторов или есть что перебирать — `for`.
  - Повторяем, пока не случится событие (ввели 0, накопили сумму), — `while`.
tasks:
  - slug: t1
    title: Таблица умножения
    difficulty: easy
    mode: stdout
    description: |
      Выведите таблицу умножения числа `n` от 1 до 10 в формате `n x i = ответ`.

      **Что уже есть:** переменная `n`.

      **Пример:** при `n = 3` первые строки вывода:

      ```text
      3 x 1 = 3
      3 x 2 = 6
      3 x 3 = 9
      ```

      **Как проверим:** сравним все 10 строк для разных `n`.
    starter: |
      n = 3  # при проверке подставим другое число
      # Выведите 10 строк таблицы умножения
    solution: |
      for i in range(1, 11):
          print(n, "x", i, "=", n * i)
    hints:
      - Какие числа должна перебрать переменная цикла?
      - Используйте for i in range(1, 11) — правая граница не входит. В print() перечислите n, "x", i, "=", n * i.
      - 'Квадраты чисел от 1 до 5: for i in range(1, 6): print(i, i * i)'
    tests:
      - description: Таблица на 3
        input: { n: 3 }
        expected: "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30"
        visible: true
      - description: Таблица на 7
        input: { n: 7 }
        expected: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70"

  - slug: t2
    title: Чётные числа
    difficulty: easy
    mode: stdout
    description: |
      Выведите все чётные числа от 2 до `n` включительно, по одному в строке.

      **Что уже есть:** переменная `n` (не меньше 2).

      **Пример:** при `n = 9` вывод:

      ```text
      2
      4
      6
      8
      ```

      **Как проверим:** подставим чётные и нечётные `n`.
    starter: |
      n = 9  # при проверке подставим другое число
      # Выведите чётные числа от 2 до n
    solution: |
      for i in range(2, n + 1, 2):
          print(i)
    hints:
      - С какого числа начать, где закончить и с каким шагом идти?
      - range(2, n + 1, 2) — от 2 до n включительно с шагом 2.
      - 'Числа 5, 10, 15, 20: for x in range(5, 21, 5): print(x)'
    tests:
      - description: n = 9
        input: { n: 9 }
        expected: "2\n4\n6\n8"
        visible: true
      - description: n = 10 включительно
        input: { n: 10 }
        expected: "2\n4\n6\n8\n10"
      - description: n = 2
        input: { n: 2 }
        expected: "2"

  - slug: t3
    title: Сколько раз встречается буква
    difficulty: medium
    mode: variable
    description: |
      Посчитайте, сколько раз буква `letter` встречается в тексте `text`, и запишите число в переменную `result`.

      **Что уже есть:** переменные `text` и `letter`.

      **Пример:** для `text = "мама мыла раму"` и `letter = "м"` в `result` должно быть `4`.

      ```text
      result = 4
      ```

      **Как проверим:** посмотрим значение `result` для разных текстов, в том числе без этой буквы.
    starter: |
      text = "мама мыла раму"  # при проверке подставим другие значения
      letter = "м"
      count = 0
      # Переберите символы text, посчитайте совпадения с letter
      # и запишите ответ в result
    solution: |
      result = 0
      for ch in text:
          if ch == letter:
              result += 1
    hints:
      - Какое значение должно быть у счётчика до начала перебора и когда его увеличивать?
      - Перебирайте символы через for ch in text и прибавляйте 1 к result, когда ch == letter.
      - 'Счёт пробелов: spaces = 0, for ch in s: if ch == " ": spaces += 1'
    tests:
      - description: Буква «м»
        input: { text: мама мыла раму, letter: м }
        expected: 4
        visible: true
      - description: Буквы нет
        input: { text: привет, letter: ю }
        expected: 0
      - description: Каждая буква совпадает
        input: { text: ааа, letter: а }
        expected: 3

  - slug: t4
    title: Факториал
    difficulty: medium
    mode: variable
    description: |
      Факториал числа `n` — произведение всех чисел от 1 до `n` (а факториал 0 равен 1). Запишите факториал `n` в `result`.

      **Что уже есть:** переменная `n` (от 0 до 15).

      **Пример:** при `n = 5` в `result` должно быть `120`, потому что 1 · 2 · 3 · 4 · 5 = 120.

      ```text
      result = 120
      ```

      **Как проверим:** посмотрим `result` для разных `n`, в том числе 0 и 1.
    starter: |
      n = 5  # при проверке подставим другое число
      result = 0
      # Умножьте result на все числа от 1 до n
    solution: |
      result = 1
      for i in range(1, n + 1):
          result *= i
    hints:
      - С какого числа начинать произведение, чтобы оно не стало нулём?
      - Начальное значение result = 1. В цикле for i in range(1, n + 1) умножайте result на i.
      - 'Произведение чисел 2, 4, 6: p = 1, for x in range(2, 7, 2): p *= x'
    tests:
      - description: n = 5
        input: { n: 5 }
        expected: 120
        visible: true
      - description: n = 0
        input: { n: 0 }
        expected: 1
      - description: n = 10
        input: { n: 10 }
        expected: 3628800

  - slug: t5
    title: Простое число
    difficulty: hard
    mode: stdout
    description: |
      Число простое, если у него ровно два делителя: 1 и само число. Выведите `простое` или `составное` для числа `n`.

      **Что уже есть:** переменная `n` (не меньше 2).

      **Пример:** при `n = 7` вывод:

      ```text
      простое
      ```

      **Как проверим:** подставим простые и составные числа, в том числе 2.
    starter: |
      n = 7  # при проверке подставим другое число
      # Посчитайте делители от 2 до n - 1
    solution: |
      divisors = 0
      for d in range(2, n):
          if n % d == 0:
              divisors += 1
      if divisors == 0:
          print("простое")
      else:
          print("составное")
    hints:
      - Какие числа нужно проверить как возможные делители и как понять, что d делит n?
      - Переберите d в range(2, n), считайте случаи n % d == 0. Если таких нет — число простое.
      - 'Сколько делителей у 12 среди чисел 2–11: count = 0, for d in range(2, 12): if 12 % d == 0: count += 1'
    tests:
      - description: 7 — простое
        input: { n: 7 }
        expected: простое
        visible: true
      - description: 12 — составное
        input: { n: 12 }
        expected: составное
      - description: 2 — простое
        input: { n: 2 }
        expected: простое
      - description: 91 = 7 · 13
        input: { n: 91 }
        expected: составное
