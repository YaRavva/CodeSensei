id: m09a_list_algorithms
topic: Классические алгоритмы на списках — поиск, максимум, разворот, повторы, слияние.
theory: |
  У списков есть готовые функции: `max`, `sorted`, `sum`. Но важно понимать, **как они работают внутри** — эти приёмы нужны, когда готовой функции нет.

  ## Перебор по индексам

  `range(len(nums))` даёт индексы элементов. Тогда в цикле доступны и номер `i`, и значение `nums[i]`.

  ```python
  nums = [7, 3, 9]
  for i in range(len(nums)):
      print(i, nums[i])
  ```

  Результат:

  ```text
  0 7
  1 3
  2 9
  ```

  ## Поиск

  Чтобы найти позицию элемента, запоминают индекс. Значение `-1` значит «не нашли».

  ```python
  names = ["Аня", "Борис", "Вика"]
  position = -1
  for i in range(len(names)):
      if names[i] == "Борис":
          position = i
  print(position)
  ```

  Результат:

  ```text
  1
  ```

  ## Новый список из старого

  Можно собирать новый список по своему правилу: например, класть элемент в начало — так список разворачивается.

  ```python
  nums = [1, 2, 3]
  result = []
  for x in nums:
      result = [x] + result
  print(result)
  ```

  Результат:

  ```text
  [3, 2, 1]
  ```

  ## Два указателя

  Для двух списков заводят два индекса и двигают тот, чей элемент обработан. Цикл `while` удобен, когда шаги неравномерные.

  ```python
  a = [1, 4]
  b = [2, 3]
  i = 0
  j = 0
  while i < len(a) and j < len(b):
      print(a[i], b[j])
      i += 1
      j += 1
  ```

  Результат:

  ```text
  1 2
  4 3
  ```
tasks:
  - slug: t1
    title: Первое вхождение
    difficulty: easy
    mode: variable
    description: |
      Найдите индекс **первого** элемента списка `nums`, равного `target`, и сохраните его в `result`. Если такого нет, `result = -1`.

      **Что уже есть:** список `nums` и число `target`.

      **Пример:** для `nums = [5, 8, 3, 8]` и `target = 8` в `result`:

      ```text
      1
      ```

      **Как проверим:** посмотрим `result` для разных списков, в том числе без нужного числа.
    starter: |
      nums = [5, 8, 3, 8]  # при проверке подставим другие данные
      target = 8
      # Найдите индекс первого вхождения
    solution: |
      result = -1
      for i in range(len(nums)):
          if nums[i] == target and result == -1:
              result = i
    hints:
      - Как сделать, чтобы второе совпадение не перезаписало индекс первого?
      - Начните с result = -1 и записывайте i, только если nums[i] == target и result ещё равен -1.
      - 'Пример из теории: position = -1, if names[i] == "Борис": position = i'
    tests:
      - description: Два вхождения
        input: { nums: [5, 8, 3, 8], target: 8 }
        expected: 1
        visible: true
      - description: Нет числа
        input: { nums: [1, 2, 3], target: 7 }
        expected: -1
      - description: В начале
        input: { nums: [4, 4, 4], target: 4 }
        expected: 0

  - slug: t2
    title: Список наоборот
    difficulty: easy
    mode: variable
    description: |
      Сохраните в `result` элементы списка `nums` в обратном порядке. Не используйте `reverse`, `sorted` и срезы — соберите новый список циклом.

      **Что уже есть:** список `nums`.

      **Пример:** для `[1, 2, 3, 4]` в `result`:

      ```text
      [4, 3, 2, 1]
      ```

      **Как проверим:** посмотрим `result` для разных списков.
    starter: |
      nums = [1, 2, 3, 4]  # при проверке подставим другой список
      # Соберите перевёрнутый список в result
    solution: |
      result = []
      for x in nums:
          result = [x] + result
    hints:
      - Если каждый следующий элемент ставить в начало нового списка, что получится?
      - Начните с result = [], в цикле записывайте result = [x] + result.
      - 'Пример из теории: result = [x] + result'
    tests:
      - description: 1, 2, 3, 4
        input: { nums: [1, 2, 3, 4] }
        expected: [4, 3, 2, 1]
        visible: true
      - description: Слова
        input: { nums: [а, б] }
        expected: [б, а]
      - description: Один элемент
        input: { nums: [7] }
        expected: [7]

  - slug: t3
    title: Где максимум
    difficulty: medium
    mode: variable
    description: |
      Найдите индекс наибольшего элемента списка `nums` и сохраните его в `result`. Если наибольших несколько — индекс первого. Функцию `max()` не используйте.

      **Что уже есть:** непустой список `nums`.

      **Пример:** для `[3, 9, 2, 9]` в `result`:

      ```text
      1
      ```

      **Как проверим:** посмотрим `result` для разных списков.
    starter: |
      nums = [3, 9, 2, 9]  # при проверке подставим другой список
      # Храните индекс лучшего элемента в result
    solution: |
      result = 0
      for i in range(1, len(nums)):
          if nums[i] > nums[result]:
              result = i
    hints:
      - Нужно ли отдельно хранить само наибольшее значение, если известен его индекс?
      - Начните с result = 0 и перебирайте i от 1; если nums[i] > nums[result], запишите result = i.
      - 'Пример поиска максимума: if x > best: best = x'
    tests:
      - description: Два максимума
        input: { nums: [3, 9, 2, 9] }
        expected: 1
        visible: true
      - description: Максимум в конце
        input: { nums: [1, 2, 3] }
        expected: 2
      - description: Отрицательные
        input: { nums: [-5, -1, -3] }
        expected: 1

  - slug: t4
    title: Без повторов
    difficulty: medium
    mode: variable
    description: |
      Сохраните в `result` элементы списка `nums` без повторов: каждый элемент один раз, в порядке первого появления.

      **Что уже есть:** список `nums`.

      **Пример:** для `[3, 1, 3, 2, 1]` в `result`:

      ```text
      [3, 1, 2]
      ```

      **Как проверим:** посмотрим `result` для списков с повторами и без.
    starter: |
      nums = [3, 1, 3, 2, 1]  # при проверке подставим другой список
      # Добавляйте элемент, только если его ещё нет в result
    solution: |
      result = []
      for x in nums:
          if x not in result:
              result.append(x)
    hints:
      - Как проверить, был ли элемент уже добавлен?
      - Перед append проверьте x not in result.
      - 'Пример: if name not in guests: guests.append(name)'
    tests:
      - description: С повторами
        input: { nums: [3, 1, 3, 2, 1] }
        expected: [3, 1, 2]
        visible: true
      - description: Без повторов
        input: { nums: [1, 2, 3] }
        expected: [1, 2, 3]
      - description: Все одинаковые
        input: { nums: [кот, кот, кот] }
        expected: [кот]

  - slug: t5
    title: Слияние двух списков
    difficulty: hard
    mode: variable
    description: |
      Списки `a` и `b` отсортированы по возрастанию. Соберите в `result` один отсортированный список из всех их элементов. Не используйте `sorted` и `sort` — сравнивайте текущие элементы двух списков.

      **Что уже есть:** списки `a` и `b`.

      **Пример:** для `a = [1, 4, 7]` и `b = [2, 3, 9]` в `result`:

      ```text
      [1, 2, 3, 4, 7, 9]
      ```

      **Как проверим:** посмотрим `result` для разных пар, в том числе с пустым списком.
    starter: |
      a = [1, 4, 7]  # при проверке подставим другие списки
      b = [2, 3, 9]
      # Два индекса i и j, добавляйте меньший из a[i] и b[j]
    solution: |
      result = []
      i = 0
      j = 0
      while i < len(a) and j < len(b):
          if a[i] <= b[j]:
              result.append(a[i])
              i += 1
          else:
              result.append(b[j])
              j += 1
      while i < len(a):
          result.append(a[i])
          i += 1
      while j < len(b):
          result.append(b[j])
          j += 1
    hints:
      - Какой элемент должен попасть в результат следующим, если оба списка уже отсортированы? Что делать, когда один список закончился?
      - Пока оба индекса в пределах списков, добавляйте меньший из a[i] и b[j] и сдвигайте его индекс. Затем допишите остатки двумя циклами while.
      - 'Пример двух указателей есть в теории: while i < len(a) and j < len(b)'
    tests:
      - description: Перемешанные
        input: { a: [1, 4, 7], b: [2, 3, 9] }
        expected: [1, 2, 3, 4, 7, 9]
        visible: true
      - description: Пустой первый
        input: { a: [], b: [5, 6] }
        expected: [5, 6]
      - description: Одинаковые числа
        input: { a: [2, 2], b: [2] }
        expected: [2, 2, 2]
      - description: Один целиком меньше
        input: { a: [1, 2], b: [10, 20, 30] }
        expected: [1, 2, 10, 20, 30]
