id: m04_strings
topic: Склеиваем строки, считаем их длину и собираем текст через f-строки.
theory: |
  Строка — это текст: имя, слово, предложение. Строки можно склеивать, повторять, узнавать их длину и брать отдельные символы.

  ## Склейка и повтор

  `+` склеивает строки, `*` повторяет строку нужное число раз.

  ```python
  first = "Анна"
  last = "Петрова"
  print(first + " " + last)
  print("=" * 10)
  ```

  Результат:

  ```text
  Анна Петрова
  ==========
  ```

  Пробел между словами сам не появится — его добавляют строкой `" "`.

  ## Длина строки: len()

  `len()` возвращает количество символов, включая пробелы и знаки препинания.

  ```python
  word = "Python"
  print(len(word))
  print(len("Привет, мир!"))
  ```

  Результат:

  ```text
  6
  12
  ```

  ## Символ по индексу

  У каждого символа есть номер — **индекс**. Счёт идёт с нуля. Отрицательный индекс считает с конца: `-1` — последний символ.

  ```python
  word = "Python"
  print(word[0], word[1], word[-1])
  ```

  Результат:

  ```text
  P y n
  ```

  Индекс за пределами строки вызывает ошибку `IndexError`.

  ## f-строки

  f-строка собирает текст из значений. Перед кавычкой ставят `f`, а значения пишут в фигурных скобках `{}`. Числа превращать в строки не нужно.

  ```python
  name = "Аня"
  age = 14
  print(f"{name}, тебе {age} лет, через год будет {age + 1}")
  ```

  Результат:

  ```text
  Аня, тебе 14 лет, через год будет 15
  ```

  ## Частые ошибки

  - `"Мне " + 14` — ошибка: строку нельзя сложить с числом. Используйте f-строку: `f"Мне {14}"`.
  - Забыли `f` перед кавычкой — тогда `{name}` выведется как есть, со скобками.
tasks:
  - slug: t1
    title: Имя и фамилия
    difficulty: easy
    mode: stdout
    description: |
      Выведите имя и фамилию через один пробел.

      **Что уже есть:** переменные `first` (имя) и `last` (фамилия).

      **Пример:** при `first = "Анна"`, `last = "Петрова"` вывод:

      ```text
      Анна Петрова
      ```

      **Как проверим:** подставим другие имена и фамилии.
    starter: |
      first = "Анна"     # при проверке подставим другие значения
      last = "Петрова"
      # Выведите имя и фамилию через пробел
    solution: |
      print(first + " " + last)
    hints:
      - Какой знак склеивает строки и откуда возьмётся пробел?
      - Склейте три части через +, средняя часть — строка из одного пробела.
      - 'Пример: print(city + ", " + street) → «Москва, Арбат»'
    tests:
      - description: Анна Петрова
        input: { first: Анна, last: Петрова }
        expected: Анна Петрова
        visible: true
      - description: Другое имя
        input: { first: Иван, last: Соколов }
        expected: Иван Соколов

  - slug: t2
    title: Первая и последняя буква
    difficulty: easy
    mode: stdout
    description: |
      Выведите первую и последнюю букву слова через пробел.

      **Что уже есть:** переменная `word`.

      **Пример:** при `word = "Python"` вывод:

      ```text
      P n
      ```

      **Как проверим:** подставим слова разной длины.
    starter: |
      word = "Python"  # при проверке подставим другое слово
      # Выведите первую и последнюю букву
    solution: |
      print(word[0], word[-1])
    hints:
      - С какого числа начинается нумерация символов и как обратиться к последнему символу?
      - Первый символ — word[0], последний — word[-1].
      - 'Второй символ слова: print(word[1])'
    tests:
      - description: Слово Python
        input: { word: Python }
        expected: P n
        visible: true
      - description: Слово «кот»
        input: { word: кот }
        expected: к т
      - description: Длинное слово
        input: { word: программирование }
        expected: п е

  - slug: t3
    title: Подчёркнутый заголовок
    difficulty: medium
    mode: stdout
    description: |
      Выведите заголовок, а под ним — строку из знаков `=` ровно такой же длины.

      **Что уже есть:** переменная `title`.

      **Пример:** при `title = "Глава 1"` вывод:

      ```text
      Глава 1
      =======
      ```

      **Как проверим:** подставим заголовки разной длины.
    starter: |
      title = "Глава 1"  # при проверке подставим другой заголовок
      print(title)
      # Выведите строку из знаков = такой же длины
    solution: |
      print(title)
      print("=" * len(title))
    hints:
      - Сколько знаков = нужно и как узнать это число для любого заголовка?
      - Длину даёт len(title), а строку повторяет умножение на число.
      - 'Пять звёздочек: print("*" * 5)'
    tests:
      - description: Глава 1
        input: { title: Глава 1 }
        expected: "Глава 1\n======="
        visible: true
      - description: Длинный заголовок
        input: { title: Итоги года }
        expected: "Итоги года\n=========="

  - slug: t4
    title: Инициалы
    difficulty: medium
    mode: stdout
    description: |
      Выведите фамилию и инициалы в формате `Иванов И. П.`.

      **Что уже есть:** переменные `last` (фамилия), `first` (имя) и `middle` (отчество).

      **Пример:** для Иванова Ивана Петровича вывод:

      ```text
      Иванов И. П.
      ```

      **Как проверим:** подставим другие ФИО.
    starter: |
      last = "Иванов"   # при проверке подставим другие значения
      first = "Иван"
      middle = "Петрович"
      # Выведите фамилию и инициалы
    solution: |
      print(f"{last} {first[0]}. {middle[0]}.")
    hints:
      - Какие символы имени и отчества нужны и как их получить?
      - Первая буква — индекс [0]. Удобно собрать строку через f-строку, точки и пробелы написать прямо в ней.
      - 'Пример: print(f"{name[0]}. {surname}") → «А. Петрова»'
    tests:
      - description: Иванов Иван Петрович
        input: { last: Иванов, first: Иван, middle: Петрович }
        expected: Иванов И. П.
        visible: true
      - description: Другие ФИО
        input: { last: Смирнова, first: Ольга, middle: Андреевна }
        expected: Смирнова О. А.

  - slug: t5
    title: Рамка для слова
    difficulty: hard
    mode: stdout
    description: |
      Выведите слово в рамке. Внутри рамки — по одному пробелу слева и справа от слова.

      **Что уже есть:** переменная `word`.

      **Пример:** при `word = "Hello"` вывод:

      ```text
      +-------+
      | Hello |
      +-------+
      ```

      **Как проверим:** подставим слова разной длины — рамка должна подстраиваться.
    starter: |
      word = "Hello"  # при проверке подставим другое слово
      # Выведите три строки рамки
    solution: |
      border = "+" + "-" * (len(word) + 2) + "+"
      print(border)
      print("| " + word + " |")
      print(border)
    hints:
      - Сколько знаков - нужно в верхней строке, если слово окружено пробелами?
      - Число минусов = длина слова + 2 (два пробела). Верхнюю и нижнюю строку удобно сохранить в переменную.
      - 'Линия под словом длиной на 4 больше: print("-" * (len(text) + 4))'
    tests:
      - description: Слово Hello
        input: { word: Hello }
        expected: "+-------+\n| Hello |\n+-------+"
        visible: true
      - description: Короткое слово
        input: { word: Да }
        expected: "+----+\n| Да |\n+----+"
      - description: Длинное слово
        input: { word: Программа }
        expected: "+-----------+\n| Программа |\n+-----------+"
