id: m08a_loop_patterns
topic: Типовые приёмы с циклом — сумма, счётчик, максимум и чтение нескольких чисел.
theory: |
  Большинство задач с циклами решаются несколькими **приёмами**. Запомните их — и многие задачи станут простыми.

  ## Сумма и счётчик

  До цикла заводим переменную с нулём, в цикле её увеличиваем. Сумма прибавляет значение, счётчик — единицу.

  ```python
  total = 0
  count = 0
  for n in range(1, 11):
      total += n
      if n % 3 == 0:
          count += 1
  print(total)
  print(count)
  ```

  Результат:

  ```text
  55
  3
  ```

  ## Максимум

  Наибольшее значение запоминают в переменной: если очередное значение больше — заменяют. Начальное значение — первый элемент.

  ```python
  number = 52918
  best = number % 10
  while number > 0:
      digit = number % 10
      if digit > best:
          best = digit
      number //= 10
  print(best)
  ```

  Результат:

  ```text
  9
  ```

  ## Флаг: нашлось или нет

  Переменная `found` хранит `False`, пока подходящее значение не встретится.

  ```python
  found = False
  for n in range(1, 20):
      if n * n == 49:
          found = True
  print(found)
  ```

  Результат:

  ```text
  True
  ```

  ## Несколько чисел с клавиатуры

  Часто сначала вводят количество чисел, а потом сами числа — по одному в строке. Тогда `input()` вызывают внутри цикла:

  ```python
  n = int(input())
  total = 0
  for _ in range(n):
      total += int(input())
  print(total)
  ```

  Имя `_` означает «переменная цикла не нужна».
tasks:
  - slug: t1
    title: Сумма покупок
    difficulty: easy
    mode: stdout
    description: |
      В первой строке ввода — количество покупок, в следующих строках — их цены. Выведите общую сумму.

      **Что уже есть:** переменная `total` для суммы.

      **Пример:** ввод `3`, `120`, `45`, `30` → вывод:

      ```text
      195
      ```

      **Как проверим:** введём разные списки цен.
    starter: |
      total = 0
      # Прочитайте количество, затем столько же цен, и сложите их
    solution: |
      total = 0
      for _ in range(int(input())):
          total += int(input())
      print(total)
    hints:
      - Сколько раз нужно вызвать input() внутри цикла и что делать с каждым числом?
      - Количество повторений — int(input()) в range(). Внутри цикла total += int(input()). После цикла выведите total.
      - 'Пример: for _ in range(3): print(input())'
    tests:
      - description: Три покупки
        stdin: ["3", "120", "45", "30"]
        expected: "195"
        visible: true
      - description: Одна покупка
        stdin: ["1", "99"]
        expected: "99"
      - description: Пять покупок
        stdin: ["5", "1", "2", "3", "4", "5"]
        expected: "15"

  - slug: t2
    title: Произведение чисел
    difficulty: easy
    mode: stdout
    description: |
      В первой строке — количество чисел, дальше — сами числа по одному в строке. Выведите их произведение.

      **Что уже есть:** ничего — подумайте, с какого значения начать: с 0 или с 1?

      **Пример:** ввод `3`, `2`, `5`, `4` → вывод:

      ```text
      40
      ```

      **Как проверим:** введём разные наборы чисел, в том числе с нулём.
    starter: |
      # Заведите переменную для произведения и умножайте её в цикле
    solution: |
      product = 1
      for _ in range(int(input())):
          product *= int(input())
      print(product)
    hints:
      - Что получится, если начать произведение с нуля?
      - Начните с product = 1, в цикле умножайте product *= int(input()).
      - 'Пример суммы из теории: total = 0, total += n'
    tests:
      - description: 2 · 5 · 4
        stdin: ["3", "2", "5", "4"]
        expected: "40"
        visible: true
      - description: С нулём
        stdin: ["2", "7", "0"]
        expected: "0"
      - description: Одно число
        stdin: ["1", "-6"]
        expected: "-6"

  - slug: t3
    title: Самый высокий
    difficulty: medium
    mode: stdout
    description: |
      В первой строке — количество учеников `n` (не меньше 1), дальше — их рост в сантиметрах. Выведите наибольший рост. Функцию `max()` не используйте.

      **Что уже есть:** строка, которая читает `n`.

      **Пример:** ввод `4`, `152`, `167`, `149`, `160` → вывод:

      ```text
      167
      ```

      **Как проверим:** введём разные наборы, в том числе из одного ученика.
    starter: |
      n = int(input())
      # Запомните первый рост, затем сравнивайте с остальными
    solution: |
      n = int(input())
      best = int(input())
      for _ in range(n - 1):
          height = int(input())
          if height > best:
              best = height
      print(best)
    hints:
      - С каким значением сравнивать первый рост, если других ещё не было?
      - Прочитайте первый рост в best до цикла, затем в цикле на n - 1 повторений заменяйте best, если новый рост больше.
      - 'Пример из теории: if digit > best: best = digit'
    tests:
      - description: Четыре ученика
        stdin: ["4", "152", "167", "149", "160"]
        expected: "167"
        visible: true
      - description: Один ученик
        stdin: ["1", "140"]
        expected: "140"
      - description: Самый высокий первый
        stdin: ["3", "180", "150", "170"]
        expected: "180"

  - slug: t4
    title: Средняя температура
    difficulty: medium
    mode: stdout
    description: |
      Вводятся температуры по одной в строке, ввод заканчивается числом `999`. Выведите среднюю температуру, округлённую до 1 знака. Число `999` в расчёт не входит; хотя бы одна температура есть.

      **Что уже есть:** переменные `total` и `count`.

      **Пример:** ввод `20`, `18`, `25`, `999` → вывод:

      ```text
      21.0
      ```

      **Как проверим:** введём разные наборы температур, в том числе отрицательные.
    starter: |
      total = 0
      count = 0
      # Читайте числа, пока не встретится 999
    solution: |
      total = 0
      count = 0
      t = int(input())
      while t != 999:
          total += t
          count += 1
          t = int(input())
      print(round(total / count, 1))
    hints:
      - Нужны две вещи — сумма и количество. Какой цикл подходит, если количество чисел заранее неизвестно?
      - Прочитайте первое число до цикла, while t != 999 добавляйте его к total, увеличивайте count и читайте следующее.
      - 'Пример: x = int(input()), while x != 0: ... x = int(input())'
    tests:
      - description: Три дня
        stdin: ["20", "18", "25", "999"]
        expected: "21.0"
        visible: true
      - description: Мороз
        stdin: ["-5", "-10", "999"]
        expected: "-7.5"
      - description: Один день
        stdin: ["13", "999"]
        expected: "13.0"

  - slug: t5
    title: Лучший результат и его номер
    difficulty: hard
    mode: stdout
    description: |
      В первой строке — число участников `n`, дальше — их результаты в прыжках. Выведите лучший результат и номер участника (с 1), который его показал. Если лучших несколько — номер первого из них.

      **Что уже есть:** строка, которая читает `n`.

      **Пример:** ввод `4`, `310`, `345`, `290`, `345` → вывод:

      ```text
      345 2
      ```

      **Как проверим:** введём разные результаты, в том числе с повторами.
    starter: |
      n = int(input())
      # Храните лучший результат и номер участника
    solution: |
      n = int(input())
      best = int(input())
      best_number = 1
      for number in range(2, n + 1):
          jump = int(input())
          if jump > best:
              best = jump
              best_number = number
      print(best, best_number)
    hints:
      - Что, кроме самого результата, нужно запомнить в момент, когда найден новый лучший?
      - Храните best и best_number. Номера участников перебирайте через range(2, n + 1), обновляйте обе переменные при jump > best (строго больше — тогда останется первый).
      - 'Пример: if score > best: best = score, winner = name'
    tests:
      - description: Повтор лучшего
        stdin: ["4", "310", "345", "290", "345"]
        expected: 345 2
        visible: true
      - description: Лучший последний
        stdin: ["3", "100", "200", "300"]
        expected: 300 3
      - description: Один участник
        stdin: ["1", "250"]
        expected: 250 1
