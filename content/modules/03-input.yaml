id: m03_input
topic: Программа спрашивает данные у пользователя и работает с ответом.
theory: |
  Пока программы работали с готовыми значениями. Команда `input()` позволяет спросить данные у пользователя: программа ждёт, пока он введёт строку, и получает её.

  ## Команда input()

  `input()` возвращает то, что ввёл пользователь, **всегда в виде строки**. Обычно результат сразу кладут в переменную.

  ```python
  name = input("Как тебя зовут? ")
  print("Привет,", name)
  ```

  Если ввести `Аня`, на экране будет:

  ```text
  Как тебя зовут? Аня
  Привет, Аня
  ```

  Текст в скобках `input("...")` — это приглашение: подсказка пользователю, что ввести. Его можно не писать.

  ## Поле «Ввод программы»

  В тренажёре нет живой клавиатуры для программы. Ответы пользователя пишутся заранее в поле **«Ввод программы»**: одна строка — один вызов `input()`. При проверке тесты сами подставят свои строки ввода, а приглашения из `input("...")` в сравнении вывода не учитываются.

  ## Строка — это не число

  Из `input()` приходит текст. Если сложить два текста, они просто склеятся:

  ```python
  a = "2"
  b = "3"
  print(a + b)
  ```

  Результат:

  ```text
  23
  ```

  Чтобы считать, строку превращают в число:

  - `int(...)` — в целое число: `int("15")` → `15`;
  - `float(...)` — в дробное: `float("2.5")` → `2.5`;
  - `str(...)` — обратно в строку: `str(15)` → `"15"`.

  ```python
  a = int("2")
  b = int("3")
  print(a + b)
  print(float("1.5") * 2)
  ```

  Результат:

  ```text
  5
  3.0
  ```

  Обычно `input()` и `int()` пишут вместе: `age = int(input())`.

  ## Частые ошибки

  - `int("2.5")` — ошибка `ValueError`: дробное число превращают через `float()`.
  - `print("Мне " + 14)` — ошибка `TypeError`: строку нельзя сложить с числом. Используйте запятую в `print()` или `str(14)`.
  - Программа ждёт больше строк, чем дано в поле «Ввод программы», — добавьте строки в поле.
tasks:
  - slug: t1
    title: Приветствие по имени
    difficulty: easy
    mode: stdout
    description: |
      Прочитайте имя и выведите приветствие: `Привет, <имя>!` — без пробела перед `!`.

      **Что уже есть:** строка, которая читает имя в переменную `name`.

      **Пример:** ввод `Аня` → вывод:

      ```text
      Привет, Аня!
      ```

      **Как проверим:** подставим разные имена во ввод программы.
    starter: |
      name = input()
      # Выведите приветствие
    solution: |
      name = input()
      print("Привет, ", name, "!", sep="")
    hints:
      - Если передать в print() значения через запятую, что окажется между ними? А нужно ли это здесь?
      - Параметр sep="" убирает пробелы между значениями — тогда пробел после запятой допишите в текст сами.
      - 'Пример: print("Пока, ", name, ".", sep="") выведет «Пока, Аня.»'
    tests:
      - description: Имя Аня
        stdin: ["Аня"]
        expected: Привет, Аня!
        visible: true
      - description: Имя Максим
        stdin: ["Максим"]
        expected: Привет, Максим!

  - slug: t2
    title: Исправьте сумму
    difficulty: easy
    mode: stdout
    description: |
      Программа должна читать два целых числа и выводить их сумму, но вместо `5` выводит `23`. Исправьте её.

      **Что уже есть:** программа с ошибкой: она складывает строки.

      **Пример:** ввод `2` и `3` (в двух строках) → вывод:

      ```text
      5
      ```

      **Как проверим:** подставим другие пары чисел, в том числе отрицательные.
    starter: |
      a = input()
      b = input()
      print(a + b)
    solution: |
      a = int(input())
      b = int(input())
      print(a + b)
    hints:
      - Какого типа значение возвращает input() — число или строка?
      - Оберните input() в int(), чтобы получить целое число.
      - 'Так читают одно целое число: age = int(input())'
    tests:
      - description: 2 и 3
        stdin: ["2", "3"]
        expected: 5
        visible: true
      - description: Отрицательное число
        stdin: ["-5", "15"]
        expected: 10
      - description: Большие числа
        stdin: ["1000", "2026"]
        expected: 3026

  - slug: t3
    title: Пицца на всех
    difficulty: medium
    mode: stdout
    description: |
      Прочитайте число кусков пиццы и число друзей. Выведите, сколько целых кусков достанется каждому и сколько останется.

      **Что уже есть:** пустой редактор. Во вводе две строки: куски, затем друзья.

      **Пример:** ввод `10` и `3` → вывод:

      ```text
      Каждому: 3
      Останется: 1
      ```

      **Как проверим:** подставим другие числа во ввод программы.
    starter: |
      # Прочитайте два целых числа: куски и друзей
      # Выведите две строки: «Каждому: …» и «Останется: …»
    solution: |
      pieces = int(input())
      friends = int(input())
      print("Каждому:", pieces // friends)
      print("Останется:", pieces % friends)
    hints:
      - Какая операция даёт целое число кусков на человека, а какая — остаток?
      - Прочитайте оба числа через int(input()), затем используйте // и %.
      - 'Конфеты поровну: print("По", candies // kids, "конфет")'
    tests:
      - description: 10 кусков на троих
        stdin: ["10", "3"]
        expected: "Каждому: 3\nОстанется: 1"
        visible: true
      - description: Делится без остатка
        stdin: ["12", "4"]
        expected: "Каждому: 3\nОстанется: 0"
      - description: Кусков меньше, чем друзей
        stdin: ["2", "5"]
        expected: "Каждому: 0\nОстанется: 2"

  - slug: t4
    title: Стоимость поездки
    difficulty: medium
    mode: stdout
    description: |
      Прочитайте три дробных числа: расстояние в км, расход бензина на 100 км (в литрах) и цену литра. Выведите стоимость бензина на поездку, округлив до двух знаков.

      **Что уже есть:** пустой редактор. Ввод — три строки в указанном порядке.

      **Пример:** ввод `150`, `8`, `55.5` → вывод:

      ```text
      666.0
      ```

      **Как проверим:** подставим другие расстояния, расходы и цены.
    starter: |
      # Прочитайте расстояние, расход на 100 км и цену литра (дробные числа)
      # Выведите стоимость, округлённую до 2 знаков
    solution: |
      distance = float(input())
      consumption = float(input())
      price = float(input())
      print(round(distance / 100 * consumption * price, 2))
    hints:
      - Сколько литров нужно на distance километров, если на 100 км уходит consumption литров?
      - Литры = distance / 100 * consumption. Стоимость = литры * цена. Читайте числа через float(input()).
      - 'Цена 2.5 кг яблок по 120.5 руб.: print(round(2.5 * 120.5, 2))'
    tests:
      - description: 150 км, 8 л, 55.5 руб.
        stdin: ["150", "8", "55.5"]
        expected: "666.0"
        visible: true
      - description: Дробные значения
        stdin: ["42.5", "6.5", "60"]
        expected: "165.75"
      - description: Короткая поездка
        stdin: ["10", "10", "50"]
        expected: "50.0"

  - slug: t5
    title: Электронные часы
    difficulty: hard
    mode: stdout
    description: |
      С полуночи прошло `n` минут (может пройти и больше суток). Выведите, что показывают электронные часы, в формате `ч:мм` — минуты всегда двумя цифрами.

      **Что уже есть:** пустой редактор. Ввод — одно целое число.

      **Пример:** ввод `150` → вывод:

      ```text
      2:30
      ```

      **Как проверим:** подставим числа больше суток и с минутами меньше 10.
    starter: |
      n = int(input())
      # Найдите часы (0–23) и минуты, выведите в формате ч:мм
    solution: |
      n = int(input())
      hours = n // 60 % 24
      minutes = n % 60
      print(hours, ":", minutes // 10, minutes % 10, sep="")
    hints:
      - Сколько полных часов в n минутах и какие часы покажет циферблат, если прошло больше 24 часов?
      - Часы — n // 60 % 24, минуты — n % 60. Чтобы минут всегда было две цифры, выведите десятки и единицы минут отдельно с sep="".
      - 'Число 7 двумя цифрами: print(7 // 10, 7 % 10, sep="") → 07'
    tests:
      - description: 150 минут
        stdin: ["150"]
        expected: "2:30"
        visible: true
      - description: Больше суток
        stdin: ["1441"]
        expected: "0:01"
      - description: Минуты меньше 10
        stdin: ["725"]
        expected: "12:05"
      - description: Конец суток
        stdin: ["1439"]
        expected: "23:59"
