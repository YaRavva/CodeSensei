id: m10_string_methods
topic: Меняем регистр, заменяем и разбиваем строки, берём части срезами.
theory: |
  У строк есть **методы** — готовые команды, которые пишут через точку: `текст.upper()`. Метод не меняет исходную строку, а возвращает новую.

  ## Регистр и замена

  ```python
  s = "привет, мир"
  print(s.upper())
  print(s.capitalize())
  print(s.replace("мир", "класс"))
  print("  отступы  ".strip())
  ```

  Результат:

  ```text
  ПРИВЕТ, МИР
  Привет, мир
  привет, класс
  отступы
  ```

  `lower()` — все буквы маленькие, `strip()` убирает пробелы по краям.

  ## Поиск и проверки

  - `count(x)` — сколько раз встречается `x`;
  - `find(x)` — индекс первого вхождения или `-1`;
  - `startswith(x)`, `endswith(x)` — начинается/заканчивается ли строка на `x`;
  - `isdigit()`, `isalpha()`, `isupper()`, `islower()` — состоит ли строка из цифр, из букв, из заглавных, из строчных.

  ```python
  s = "банан"
  print(s.count("а"), s.find("н"), s.find("я"))
  print(s.startswith("ба"), "2026".isdigit(), "A".isupper())
  ```

  Результат:

  ```text
  2 2 -1
  True True True
  ```

  ## split() и join()

  `split()` разбивает строку на список слов (по пробелам или по указанному разделителю). `join()` собирает список строк в одну строку.

  ```python
  words = "мама мыла раму".split()
  print(words, len(words))
  print("-".join(words))
  print("1,2,3".split(","))
  ```

  Результат:

  ```text
  ['мама', 'мыла', 'раму'] 3
  мама-мыла-раму
  ['1', '2', '3']
  ```

  ## Срезы

  Срез `s[a:b]` берёт символы с индекса `a` до `b` (не включая `b`). Можно не писать границу: `s[:3]` — первые три, `s[-2:]` — последние два. `s[::-1]` — строка задом наперёд.

  ```python
  s = "Python"
  print(s[0:2], s[:3], s[-2:])
  print(s[::-1])
  ```

  Результат:

  ```text
  Py Pyt on
  nohtyP
  ```

  Срезы работают и для списков: `nums[1:3]`.
tasks:
  - slug: t1
    title: Громкое объявление
    difficulty: easy
    mode: variable
    description: |
      Превратите текст объявления в заглавные буквы и добавьте в конец `!`. Запишите результат в `result`.

      **Что уже есть:** строка `text`.

      **Пример:** для `text = "урок начинается"`:

      ```text
      result = "УРОК НАЧИНАЕТСЯ!"
      ```

      **Как проверим:** посмотрим `result` для разных текстов.
    starter: |
      text = "урок начинается"  # при проверке подставим другой текст
      # Запишите в result текст заглавными буквами и с ! в конце
    solution: |
      result = text.upper() + "!"
    hints:
      - Какой метод делает все буквы заглавными?
      - text.upper() возвращает новую строку — приклейте к ней "!" через +.
      - 'Маленькими буквами: result = text.lower()'
    tests:
      - description: Урок начинается
        input: { text: урок начинается }
        expected: УРОК НАЧИНАЕТСЯ!
        visible: true
      - description: Смешанный регистр
        input: { text: Все на Обед }
        expected: ВСЕ НА ОБЕД!

  - slug: t2
    title: Сколько слов
    difficulty: easy
    mode: variable
    description: |
      Запишите в `result` количество слов в предложении. Слова разделены пробелами, пробелов может быть несколько подряд.

      **Что уже есть:** строка `sentence`.

      **Пример:** для `"Я люблю   Python"`:

      ```text
      result = 3
      ```

      **Как проверим:** посмотрим `result`, в том числе для лишних пробелов.
    starter: |
      sentence = "Я люблю   Python"  # при проверке подставим другую строку
      # Запишите число слов в result
    solution: |
      result = len(sentence.split())
    hints:
      - Как получить список слов из строки?
      - split() без аргументов сам пропускает лишние пробелы. Длину списка даёт len().
      - 'Список слов: words = text.split()'
    tests:
      - description: Три слова
        input: { sentence: "Я люблю   Python" }
        expected: 3
        visible: true
      - description: Одно слово
        input: { sentence: Привет }
        expected: 1
      - description: Пробелы по краям
        input: { sentence: "  раз два  " }
        expected: 2

  - slug: t3
    title: Палиндром
    difficulty: medium
    mode: variable
    description: |
      Палиндром читается одинаково слева направо и справа налево, например «Шалаш». Запишите в `result` значение `True`, если слово — палиндром (без учёта регистра), иначе `False`.

      **Что уже есть:** строка `word` — одно слово.

      **Пример:** для `"Шалаш"`:

      ```text
      result = True
      ```

      **Как проверим:** посмотрим `result` для палиндромов и обычных слов.
    starter: |
      word = "Шалаш"  # при проверке подставим другое слово
      # Сравните слово с ним же задом наперёд
    solution: |
      w = word.lower()
      result = w == w[::-1]
    hints:
      - Как получить слово задом наперёд и почему «Шалаш» не равно «шалаШ»?
      - Приведите слово к нижнему регистру через lower(), разверните срезом [::-1] и сравните через ==.
      - 'Сравнение строк даёт True или False: result = a == b'
    tests:
      - description: Шалаш
        input: { word: Шалаш }
        expected: true
        visible: true
      - description: Не палиндром
        input: { word: Python }
        expected: false
      - description: Казак
        input: { word: казак }
        expected: true

  - slug: t4
    title: Хэштег
    difficulty: medium
    mode: variable
    description: |
      Соберите хэштег из фразы: символ `#`, затем все слова подряд без пробелов, каждое с заглавной буквы. Запишите в `result`.

      **Что уже есть:** строка `phrase`.

      **Пример:** для `"летние каникулы скоро"`:

      ```text
      result = "#ЛетниеКаникулыСкоро"
      ```

      **Как проверим:** посмотрим `result` для разных фраз.
    starter: |
      phrase = "летние каникулы скоро"  # при проверке подставим другую фразу
      # Начните с "#" и добавляйте слова с заглавной буквы
    solution: |
      result = "#"
      for word in phrase.split():
          result += word.capitalize()
    hints:
      - Как перебрать слова фразы по одному и как сделать первую букву заглавной?
      - Разбейте фразу через split(), в цикле приклеивайте word.capitalize() к строке, начинающейся с "#".
      - 'Склейка слов через тире: s = "", for w in words: s += w + "-"'
    tests:
      - description: Летние каникулы
        input: { phrase: летние каникулы скоро }
        expected: "#ЛетниеКаникулыСкоро"
        visible: true
      - description: Одно слово
        input: { phrase: python }
        expected: "#Python"
      - description: Слова в разном регистре
        input: { phrase: мой ЛЮБИМЫЙ урок }
        expected: "#МойЛюбимыйУрок"

  - slug: t5
    title: Номер телефона
    difficulty: hard
    mode: variable
    description: |
      Номер телефона записан как угодно: `+7 (912) 345-67-89`, `8 912 345 67 89`. Приведите его к виду `+79123456789`: оставьте только цифры, первую `8` замените на `7`, добавьте `+` в начало. Запишите в `result`.

      **Что уже есть:** строка `phone` — российский номер из 11 цифр.

      **Пример:** для `"8 (912) 345-67-89"`:

      ```text
      result = "+79123456789"
      ```

      **Как проверим:** подставим номера в разных записях.
    starter: |
      phone = "8 (912) 345-67-89"  # при проверке подставим другой номер
      digits = ""
      # Оставьте только цифры, замените первую 8 на 7, добавьте +
    solution: |
      digits = ""
      for ch in phone:
          if ch.isdigit():
              digits += ch
      if digits.startswith("8"):
          digits = "7" + digits[1:]
      result = "+" + digits
    hints:
      - Как отобрать из строки только цифры? Что делать, если номер начинается с 8?
      - Перебирайте символы и добавляйте те, у которых isdigit() даёт True. Потом, если digits.startswith("8"), соберите "7" + digits[1:].
      - 'Только буквы из строки: letters = "", for ch in s: if ch.isalpha(): letters += ch'
    tests:
      - description: С восьмёркой и скобками
        input: { phone: 8 (912) 345-67-89 }
        expected: "+79123456789"
        visible: true
      - description: Уже с +7
        input: { phone: +7 912 345 67 89 }
        expected: "+79123456789"
      - description: Только цифры
        input: { phone: "89001112233" }
        expected: "+79001112233"
