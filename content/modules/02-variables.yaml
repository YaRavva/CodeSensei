id: m02_variables
topic: Храним значения в переменных и считаем, как на калькуляторе.
theory: |
  Переменная — это «коробка с именем», в которой программа хранит значение. Python умеет считать с числами в переменных: складывать, умножать, делить, находить остаток.

  ## Переменные

  Знак `=` кладёт значение в переменную. Слева — имя, справа — значение.

  ```python
  apples = 5
  price = 30
  print(apples)
  print(price)
  ```

  Результат:

  ```text
  5
  30
  ```

  Имя переменной пишут латинскими буквами, без пробелов: `price`, `total_sum`, `age2`. Большие и маленькие буквы различаются: `Price` и `price` — разные переменные.

  ## Арифметика

  ```python
  a = 7
  b = 2
  print(a + b, a - b, a * b)
  print(a ** b)
  ```

  Результат:

  ```text
  9 5 14
  49
  ```

  `**` — возведение в степень: `7 ** 2` — это 7 в квадрате.

  ## Три вида деления

  - `/` — обычное деление, результат всегда дробный: `7 / 2` → `3.5`;
  - `//` — целая часть от деления: `7 // 2` → `3`;
  - `%` — остаток от деления: `7 % 2` → `1`.

  ```python
  minutes = 135
  print(minutes // 60, "ч", minutes % 60, "мин")
  print(10 / 4)
  ```

  Результат:

  ```text
  2 ч 15 мин
  2.5
  ```

  Остаток помогает разбирать число на цифры: `n % 10` — последняя цифра, `n // 10` — число без последней цифры.

  ## Порядок действий

  Как в математике: сначала `**`, потом `*`, `/`, `//`, `%`, потом `+` и `-`. Скобки меняют порядок.

  ```python
  print(2 + 3 * 4)
  print((2 + 3) * 4)
  ```

  Результат:

  ```text
  14
  20
  ```

  ## Дробные числа, round() и abs()

  Дробную часть отделяют **точкой**: `3.5`, а не `3,5`. `round(x, 2)` округляет до двух знаков после точки, `abs(x)` убирает минус.

  ```python
  average = (5 + 4 + 4) / 3
  print(round(average, 2))
  print(abs(-12))
  ```

  Результат:

  ```text
  4.33
  12
  ```

  ## Переменную можно изменить

  ```python
  score = 10
  score = score + 5
  print(score)
  ```

  Результат:

  ```text
  15
  ```

  Справа сначала вычисляется `score + 5`, потом результат кладётся обратно в `score`.

  ## Как устроены задания этого модуля

  В заданиях исходные данные уже лежат в переменных, например `a = 2`. При проверке мы подставим в эти переменные **другие** числа, поэтому считайте через имена переменных, а не готовые числа.
tasks:
  - slug: t1
    title: Сумма двух чисел
    difficulty: easy
    mode: stdout
    description: |
      Выведите сумму чисел из переменных `a` и `b`.

      **Что уже есть:** переменные `a` и `b`. При проверке в них будут другие числа.

      **Пример:** если `a = 2`, `b = 3`, программа выводит:

      ```text
      5
      ```

      **Как проверим:** подставим разные `a` и `b` и сравним вывод с их суммой.
    starter: |
      a = 2  # при проверке подставим другие числа
      b = 3
      # Выведите сумму a и b
    solution: |
      print(a + b)
    hints:
      - Какой знак складывает числа и что нужно передать в print()?
      - Передайте в print() выражение из имён переменных, а не готовое число 5.
      - 'Разность двух переменных выводят так: print(x - y)'
    tests:
      - description: 2 + 3
        input: { a: 2, b: 3 }
        expected: 5
        visible: true
      - description: Отрицательное число
        input: { a: 10, b: -4 }
        expected: 6
      - description: Нули
        input: { a: 0, b: 0 }
        expected: 0

  - slug: t2
    title: Обед в столовой
    difficulty: easy
    mode: stdout
    description: |
      Порция стоит `price` рублей, вы берёте `count` порций. Выведите, сколько всего нужно заплатить.

      **Что уже есть:** переменные `price` и `count`.

      **Пример:** при `price = 45` и `count = 3` программа выводит:

      ```text
      135
      ```

      **Как проверим:** подставим другие цену и количество.
    starter: |
      price = 45  # цена одной порции
      count = 3   # количество порций
      # Выведите общую стоимость
    solution: |
      print(price * count)
    hints:
      - Если одна порция стоит price, сколько стоят count порций?
      - Нужно умножение — знак *.
      - 'Пример: стоимость 4 тетрадей по 20 рублей — print(4 * 20)'
    tests:
      - description: 3 порции по 45
        input: { price: 45, count: 3 }
        expected: 135
        visible: true
      - description: 2 порции по 60
        input: { price: 60, count: 2 }
        expected: 120
      - description: Одна порция
        input: { price: 75, count: 1 }
        expected: 75

  - slug: t3
    title: Минуты и секунды
    difficulty: medium
    mode: stdout
    description: |
      Видео длится `seconds` секунд. Выведите длительность в минутах и секундах в формате `2 мин 5 сек`.

      **Что уже есть:** переменная `seconds`.

      **Пример:** при `seconds = 125` вывод:

      ```text
      2 мин 5 сек
      ```

      **Как проверим:** подставим другие числа, в том числе меньше минуты.
    starter: |
      seconds = 125  # при проверке подставим другое число
      # Выведите минуты и секунды
    solution: |
      print(seconds // 60, "мин", seconds % 60, "сек")
    hints:
      - Сколько целых минут помещается в seconds и сколько секунд остаётся?
      - Целые минуты даёт //, оставшиеся секунды — % (остаток от деления на 60).
      - 'Похожий расчёт для часов: print(minutes // 60, "ч", minutes % 60, "мин")'
    tests:
      - description: 125 секунд
        input: { seconds: 125 }
        expected: 2 мин 5 сек
        visible: true
      - description: Меньше минуты
        input: { seconds: 59 }
        expected: 0 мин 59 сек
      - description: Ровно час
        input: { seconds: 3600 }
        expected: 60 мин 0 сек

  - slug: t4
    title: Средняя оценка
    difficulty: medium
    mode: stdout
    description: |
      За четверть у ученика три оценки: `a`, `b` и `c`. Выведите среднюю оценку, округлённую до двух знаков после точки.

      **Что уже есть:** переменные `a`, `b`, `c`.

      **Пример:** при оценках 5, 4 и 4 вывод:

      ```text
      4.33
      ```

      **Как проверим:** подставим другие оценки.
    starter: |
      a = 5  # при проверке подставим другие оценки
      b = 4
      c = 4
      # Выведите среднюю оценку, округлённую до 2 знаков
    solution: |
      print(round((a + b + c) / 3, 2))
    hints:
      - Как вычисляют среднее из трёх чисел и что нужно сделать сначала — сложить или поделить?
      - Сумму возьмите в скобки, поделите на 3, а затем округлите через round(..., 2).
      - 'Среднее двух чисел: print(round((x + y) / 2, 2))'
    tests:
      - description: Оценки 5, 4, 4
        input: { a: 5, b: 4, c: 4 }
        expected: "4.33"
        visible: true
      - description: Оценки 3, 4, 5
        input: { a: 3, b: 4, c: 5 }
        expected: "4.0"
      - description: Оценки 5, 5, 4
        input: { a: 5, b: 5, c: 4 }
        expected: "4.67"

  - slug: t5
    title: Сумма цифр
    difficulty: hard
    mode: stdout
    description: |
      В переменной `n` — трёхзначное число. Выведите сумму его цифр.

      **Что уже есть:** переменная `n` (от 100 до 999).

      **Пример:** при `n = 123` вывод `6`, потому что 1 + 2 + 3 = 6:

      ```text
      6
      ```

      **Как проверим:** подставим другие трёхзначные числа, в том числе с нулями.
    starter: |
      n = 123  # при проверке подставим другое трёхзначное число
      # Найдите сотни, десятки и единицы, выведите их сумму
    solution: |
      hundreds = n // 100
      tens = n // 10 % 10
      units = n % 10
      print(hundreds + tens + units)
    hints:
      - Как с помощью // и % получить последнюю цифру числа? А первую?
      - n % 10 — единицы, n // 100 — сотни. Для десятков сначала уберите последнюю цифру (// 10), затем возьмите остаток от деления на 10.
      - 'Для двузначного числа x сумма цифр: print(x // 10 + x % 10)'
    tests:
      - description: Число 123
        input: { n: 123 }
        expected: 6
        visible: true
      - description: Число с нулём в середине
        input: { n: 905 }
        expected: 14
      - description: Число 100
        input: { n: 100 }
        expected: 1
      - description: Число 999
        input: { n: 999 }
        expected: 27
