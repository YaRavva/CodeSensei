id: m07_while
topic: Повторяем действия, пока выполняется условие.
theory: |
  Цикл повторяет команды много раз. Цикл `while` («пока») выполняет команды снова и снова, **пока условие верно**.

  ## Цикл while

  ```python
  n = 3
  while n > 0:
      print(n)
      n = n - 1
  print("Старт!")
  ```

  Результат:

  ```text
  3
  2
  1
  Старт!
  ```

  Каждый повтор называют **итерацией**. Перед каждой итерацией Python проверяет условие. Внутри цикла что-то должно меняться — иначе условие останется верным навсегда и цикл будет **бесконечным**.

  ## Короткая запись: +=, -=, *=

  `n -= 1` — то же, что `n = n - 1`. Так же работают `+=`, `*=`, `//=`.

  ```python
  x = 1
  x += 4
  x *= 3
  print(x)
  ```

  Результат:

  ```text
  15
  ```

  ## Счётчик и сумма

  Типичная схема: перед циклом заводим переменную для результата, в цикле её обновляем, после цикла выводим.

  ```python
  i = 1
  total = 0
  while i <= 4:
      total += i
      i += 1
  print(total)
  ```

  Результат:

  ```text
  10
  ```

  ## break и continue

  `break` сразу останавливает цикл. `continue` пропускает остаток текущей итерации и переходит к следующей. Часто пишут `while True:` — «повторять всегда» — и выходят через `break`.

  ```python
  n = 0
  while True:
      n += 1
      if n % 2 == 0:
          continue
      if n > 7:
          break
      print(n)
  ```

  Результат:

  ```text
  1
  3
  5
  7
  ```

  ## Частые ошибки

  - Забыли изменить переменную в цикле — программа «зависнет». В тренажёре она остановится по таймауту.
  - Неверная граница: `while i < 4` и `while i <= 4` выполнятся разное число раз.
tasks:
  - slug: t1
    title: Обратный отсчёт
    difficulty: easy
    mode: stdout
    description: |
      Выведите числа от `n` до 1 по одному в строке.

      **Что уже есть:** переменная `n`.

      **Пример:** при `n = 3` вывод:

      ```text
      3
      2
      1
      ```

      **Как проверим:** подставим другие `n`.
    starter: |
      n = 3  # при проверке подставим другое число
      # Выведите числа от n до 1 с помощью while
    solution: |
      while n > 0:
          print(n)
          n -= 1
    hints:
      - Пока какое условие верно, нужно продолжать вывод? Что должно меняться на каждом шаге?
      - Условие цикла — n > 0. Внутри выведите n и уменьшите его на 1.
      - 'Счёт от 1 до 5: i = 1, while i <= 5: print(i), i += 1'
    tests:
      - description: n = 3
        input: { n: 3 }
        expected: "3\n2\n1"
        visible: true
      - description: n = 5
        input: { n: 5 }
        expected: "5\n4\n3\n2\n1"
      - description: n = 1
        input: { n: 1 }
        expected: "1"

  - slug: t2
    title: Степени двойки
    difficulty: easy
    mode: stdout
    description: |
      Выведите все степени двойки (1, 2, 4, 8, …), которые меньше `n`, по одной в строке.

      **Что уже есть:** переменная `n` (больше 1).

      **Пример:** при `n = 20` вывод:

      ```text
      1
      2
      4
      8
      16
      ```

      **Как проверим:** подставим другие `n`, в том числе саму степень двойки.
    starter: |
      n = 20  # при проверке подставим другое число
      x = 1
      # Пока x меньше n — выводите x и удваивайте его
    solution: |
      x = 1
      while x < n:
          print(x)
          x *= 2
    hints:
      - Как из одной степени двойки получить следующую?
      - Начните с x = 1, в цикле while x < n выводите x и умножайте его на 2.
      - 'Числа 1, 3, 9, 27 меньше 50: x = 1, while x < 50: print(x), x *= 3'
    tests:
      - description: n = 20
        input: { n: 20 }
        expected: "1\n2\n4\n8\n16"
        visible: true
      - description: n = 16 — 16 не выводится
        input: { n: 16 }
        expected: "1\n2\n4\n8"
      - description: n = 2
        input: { n: 2 }
        expected: "1"

  - slug: t3
    title: Копим на велосипед
    difficulty: medium
    mode: stdout
    description: |
      Велосипед стоит `price` рублей. Каждую неделю вы откладываете `weekly` рублей. Выведите, через сколько недель хватит денег.

      **Что уже есть:** переменные `price` и `weekly` (оба больше 0).

      **Пример:** при `price = 1000`, `weekly = 300` вывод:

      ```text
      4
      ```

      **Как проверим:** подставим другие цены и суммы, в том числе случай «ровно хватает».
    starter: |
      price = 1000  # при проверке подставим другие значения
      weekly = 300
      saved = 0
      weeks = 0
      # Пока накоплено меньше цены — добавляйте неделю
    solution: |
      saved = 0
      weeks = 0
      while saved < price:
          saved += weekly
          weeks += 1
      print(weeks)
    hints:
      - Какие две величины меняются каждую неделю?
      - В цикле while saved < price увеличивайте saved на weekly и weeks на 1. После цикла выведите weeks.
      - 'Сколько шагов по 3 нужно, чтобы дойти до 10: pos = 0, steps = 0, while pos < 10: pos += 3, steps += 1'
    tests:
      - description: 1000 по 300
        input: { price: 1000, weekly: 300 }
        expected: 4
        visible: true
      - description: Ровно хватает
        input: { price: 900, weekly: 300 }
        expected: 3
      - description: Одна неделя
        input: { price: 50, weekly: 100 }
        expected: 1

  - slug: t4
    title: Сумма до нуля
    difficulty: medium
    mode: stdout
    description: |
      Программа читает целые числа по одному в строке, пока не встретит `0`. Выведите сумму прочитанных чисел (ноль не считается).

      **Что уже есть:** пустой редактор. Во вводе последнее число всегда `0`.

      **Пример:** ввод `5`, `3`, `0` → вывод:

      ```text
      8
      ```

      **Как проверим:** подставим разные наборы, в том числе сразу `0`.
    starter: |
      total = 0
      # Читайте числа в цикле while True, при нуле — break
    solution: |
      total = 0
      while True:
          x = int(input())
          if x == 0:
              break
          total += x
      print(total)
    hints:
      - Сколько чисел будет во вводе — известно заранее? Когда нужно остановиться?
      - Используйте while True — внутри читайте число, при x == 0 делайте break, иначе прибавляйте к total.
      - 'Чтение слов до «стоп»: while True: w = input(), if w == "стоп": break'
    tests:
      - description: 5, 3, 0
        stdin: ["5", "3", "0"]
        expected: 8
        visible: true
      - description: Сразу ноль
        stdin: ["0"]
        expected: 0
      - description: С отрицательными
        stdin: ["10", "-4", "7", "0"]
        expected: 13

  - slug: t5
    title: Цифры числа
    difficulty: hard
    mode: stdout
    description: |
      Выведите через пробел, сколько цифр в натуральном числе `n` и чему равна их сумма.

      **Что уже есть:** переменная `n` (больше 0).

      **Пример:** при `n = 12345` вывод:

      ```text
      5 15
      ```

      **Как проверим:** подставим числа разной длины, в том числе с нулями.
    starter: |
      n = 12345  # при проверке подставим другое число
      count = 0
      total = 0
      # Отделяйте последнюю цифру, пока число не станет 0
    solution: |
      count = 0
      total = 0
      while n > 0:
          total += n % 10
          count += 1
          n //= 10
      print(count, total)
    hints:
      - Как получить последнюю цифру числа и как её «отбросить»?
      - В цикле while n > 0 прибавляйте n % 10 к сумме, увеличивайте счётчик и делите n на 10 через //=.
      - 'Последняя цифра 357 — 357 % 10 = 7, а 357 // 10 = 35'
    tests:
      - description: 12345
        input: { n: 12345 }
        expected: "5 15"
        visible: true
      - description: Одна цифра
        input: { n: 7 }
        expected: "1 7"
      - description: Число с нулями
        input: { n: 1000 }
        expected: "4 1"
