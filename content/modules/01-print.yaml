id: m01_print
topic: Первые команды Python — выводим текст и числа на экран.
theory: |
  Программа — это список команд для компьютера. Первая команда, которую мы изучим, — `print()`: она выводит на экран текст и числа.

  ## Команда print()

  Внутри скобок пишем то, что нужно показать. Текст всегда берём в кавычки — так Python понимает, что это строка, а не команда.

  ```python
  print("Привет!")
  print("Я учу Python")
  ```

  Результат:

  ```text
  Привет!
  Я учу Python
  ```

  Каждый `print()` начинает новую строку. Числа можно писать без кавычек:

  ```python
  print(2026)
  print(7 + 3)
  ```

  Результат:

  ```text
  2026
  10
  ```

  ## Несколько значений через запятую

  В один `print()` можно передать несколько значений через запятую. Python выведет их в одну строку и поставит между ними пробел.

  ```python
  print("Мне", 14, "лет")
  ```

  Результат:

  ```text
  Мне 14 лет
  ```

  ## Параметры sep и end

  `sep` задаёт, что ставить **между** значениями (по умолчанию пробел). `end` задаёт, чем **закончить** строку (по умолчанию переход на новую строку).

  ```python
  print(5, 11, 2026, sep=".")
  print("Загрузка", end="...")
  print("готово")
  ```

  Результат:

  ```text
  5.11.2026
  Загрузка...готово
  ```

  ## Комментарии

  Всё, что стоит после знака `#`, Python пропускает. Комментарии пишут для людей — чтобы объяснить код.

  ```python
  # Это комментарий, он не выполняется
  print("А это команда")  # комментарий можно писать и после команды
  ```

  Результат:

  ```text
  А это команда
  ```

  ## Частые ошибки

  - Забыли кавычки: `print(Привет)` — Python ищет переменную `Привет` и выдаёт `NameError`.
  - Разные кавычки: `print("Привет')` — открыть и закрыть строку нужно одинаковыми кавычками.
  - Лишний пробел или другой знак препинания: проверка сравнивает вывод **точно**, символ в символ.
tasks:
  - slug: t1
    title: Привет, мир!
    difficulty: easy
    mode: stdout
    description: |
      Выведите на экран фразу `Привет, мир!` — с запятой и восклицательным знаком.

      **Что уже есть:** в редакторе заготовка `print(___)`. Замените `___` на текст в кавычках.

      **Пример вывода:**

      ```text
      Привет, мир!
      ```

      **Как проверим:** программа должна вывести ровно эту строку.
    starter: |
      # Замените ___ на текст в кавычках
      print(___)
    solution: |
      print("Привет, мир!")
    hints:
      - Что должно стоять внутри скобок print(), чтобы Python понял, что это текст, а не имя переменной?
      - Текст берут в кавычки. Запятая и восклицательный знак — часть текста, они тоже внутри кавычек.
      - 'Так выводят другую фразу: print("Доброе утро!")'
    tests:
      - description: Выводится фраза «Привет, мир!»
        expected: Привет, мир!
        visible: true

  - slug: t2
    title: Расписание на понедельник
    difficulty: easy
    mode: stdout
    description: |
      Выведите расписание уроков — каждый урок на своей строке.

      **Что уже есть:** пустой редактор. Понадобится по одному `print()` на строку.

      **Пример вывода:**

      ```text
      1. Математика
      2. Русский язык
      3. Физкультура
      ```

      **Как проверим:** вывод должен совпасть с примером построчно.
    starter: |
      # Выведите три строки расписания, каждую своим print()
    solution: |
      print("1. Математика")
      print("2. Русский язык")
      print("3. Физкультура")
    hints:
      - Сколько строк в выводе и сколько команд print() для этого нужно?
      - Каждый print() выводит одну строку. Номер урока и точка — тоже часть текста в кавычках.
      - 'Две строки выводят так: print("Утро") и на следующей строке print("Вечер")'
    tests:
      - description: Три строки расписания
        expected: "1. Математика\n2. Русский язык\n3. Физкультура"
        visible: true

  - slug: t3
    title: Дата через точку
    difficulty: medium
    mode: stdout
    description: |
      Выведите дату `1.9.2026`: день, месяц и год передайте в `print()` тремя отдельными числами, а точки между ними поставьте через параметр `sep`.

      **Что уже есть:** `print(1, 9, 2026)` выводит `1 9 2026` — с пробелами.

      **Пример вывода:**

      ```text
      1.9.2026
      ```

      **Как проверим:** программа должна вывести ровно `1.9.2026`.
    starter: |
      # Сейчас между числами пробелы. Поставьте точки с помощью sep
      print(1, 9, 2026)
    solution: |
      print(1, 9, 2026, sep=".")
    hints:
      - Какой символ print() ставит между значениями сейчас и как его поменять?
      - Параметр sep задаёт разделитель между значениями. Он пишется в скобках последним, через запятую.
      - 'Так выводят время через двоеточие: print(10, 30, sep=":") → 10:30'
    tests:
      - description: Дата 1.9.2026
        expected: 1.9.2026
        visible: true

  - slug: t4
    title: Загрузка игры
    difficulty: medium
    mode: stdout
    description: |
      Сделайте так, чтобы два `print()` вывели **одну** строку: `Загрузка уровня... 100%`.

      **Что уже есть:** две команды. Сейчас вторая часть уходит на новую строку.

      **Пример вывода:**

      ```text
      Загрузка уровня... 100%
      ```

      **Как проверим:** вывод должен быть одной строкой, точно как в примере.
    starter: |
      # Добавьте параметр end в первый print, чтобы не было переноса строки
      print("Загрузка уровня")
      print("100%")
    solution: |
      print("Загрузка уровня", end="... ")
      print("100%")
    hints:
      - Что print() по умолчанию выводит в конце строки и как это заменить?
      - Параметр end задаёт, чем закончить вывод. Вместо переноса строки нужны три точки и пробел.
      - 'Пример: print("Раз", end=", ") и затем print("два") выведут: Раз, два'
    tests:
      - description: Одна строка «Загрузка уровня... 100%»
        expected: Загрузка уровня... 100%
        visible: true

  - slug: t5
    title: Билет в кино
    difficulty: hard
    mode: stdout
    description: |
      Выведите билет в кино ровно в таком виде, как в примере: рамка из звёздочек, название фильма и место.

      **Что уже есть:** первая строка билета. Строку `Ряд: 5, место: 12` удобно вывести одним `print()` с несколькими значениями.

      **Пример вывода:**

      ```text
      *** КИНОБИЛЕТ ***
      Фильм: Космос
      Ряд: 5, место: 12
      *****************
      ```

      **Как проверим:** вывод должен совпасть с примером символ в символ.
    starter: |
      print("*** КИНОБИЛЕТ ***")
      # Допишите остальные три строки билета
    solution: |
      print("*** КИНОБИЛЕТ ***")
      print("Фильм:", "Космос")
      print("Ряд:", 5, end=", ")
      print("место:", 12)
      print("*****************")
    hints:
      - Сколько строк в билете и какие из них можно собрать из нескольких значений?
      - Запятая в print() ставит пробел. Чтобы строка «Ряд…» и «место…» оказались рядом, используйте end или выведите всё одной строкой.
      - 'Похожая строка: print("Класс:", 7, end=", ") и затем print("буква:", "Б") → Класс: 7, буква: Б'
    tests:
      - description: Билет совпадает с примером
        expected: "*** КИНОБИЛЕТ ***\nФильм: Космос\nРяд: 5, место: 12\n*****************"
        visible: true
