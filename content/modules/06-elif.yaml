id: m06_elif
topic: Выбираем один из многих вариантов и объединяем условия.
theory: |
  Часто вариантов больше двух: оценка бывает 2, 3, 4 или 5. Для этого есть `elif`, а условия можно объединять словами `and`, `or` и `not`.

  ## elif — «иначе если»

  Python проверяет условия сверху вниз и выполняет **первую** подходящую ветку. Остальные пропускает.

  ```python
  score = 82
  if score >= 90:
      print(5)
  elif score >= 75:
      print(4)
  elif score >= 50:
      print(3)
  else:
      print(2)
  ```

  Результат:

  ```text
  4
  ```

  Порядок важен: если первой проверить `score >= 50`, то и 95 баллов дадут тройку.

  ## and, or, not

  - `and` — «и»: верно, когда верны **оба** условия;
  - `or` — «или»: верно, когда верно **хотя бы одно**;
  - `not` — «не»: меняет `True` на `False` и наоборот.

  ```python
  age = 15
  has_ticket = True
  print(age >= 12 and has_ticket)
  day = "суббота"
  print(day == "суббота" or day == "воскресенье")
  print(not has_ticket)
  ```

  Результат:

  ```text
  True
  True
  False
  ```

  ## Проверка диапазона

  Чтобы проверить, что число в промежутке, используют `and` или двойное сравнение:

  ```python
  hour = 14
  if 12 <= hour and hour < 18:
      print("день")
  if 12 <= hour < 18:
      print("тоже день")
  ```

  Результат:

  ```text
  день
  тоже день
  ```

  ## Частые ошибки

  - `if day == "сб" or "вс":` — так нельзя. Правильно: `day == "сб" or day == "вс"`.
  - Ветки `elif` в неправильном порядке: широкое условие сверху «съедает» остальные.
tasks:
  - slug: t1
    title: Выходной или учебный
    difficulty: easy
    mode: stdout
    description: |
      Дни недели пронумерованы от 1 (понедельник) до 7 (воскресенье). Выведите `выходной` для субботы и воскресенья, иначе — `учебный`.

      **Что уже есть:** переменная `day`.

      **Пример:** при `day = 6` вывод:

      ```text
      выходной
      ```

      **Как проверим:** подставим будни и выходные.
    starter: |
      day = 6  # при проверке подставим другой день
      # Выведите «выходной» или «учебный»
    solution: |
      if day == 6 or day == 7:
          print("выходной")
      else:
          print("учебный")
    hints:
      - Какие два номера дня считаются выходными и как проверить «то или другое»?
      - Используйте or — day == 6 or day == 7.
      - 'Пример: if color == "красный" or color == "жёлтый": print("стой")'
    tests:
      - description: Суббота
        input: { day: 6 }
        expected: выходной
        visible: true
      - description: Воскресенье
        input: { day: 7 }
        expected: выходной
      - description: Среда
        input: { day: 3 }
        expected: учебный

  - slug: t2
    title: Аттракцион
    difficulty: easy
    mode: stdout
    description: |
      На аттракцион пускают детей ростом от 120 до 190 см включительно. Выведите `можно` или `нельзя`.

      **Что уже есть:** переменная `height` — рост в сантиметрах.

      **Пример:** при `height = 135` вывод:

      ```text
      можно
      ```

      **Как проверим:** подставим рост внутри промежутка, на границах и за ними.
    starter: |
      height = 135  # при проверке подставим другой рост
      # Выведите «можно» или «нельзя»
    solution: |
      if height >= 120 and height <= 190:
          print("можно")
      else:
          print("нельзя")
    hints:
      - Сколько условий должно выполниться одновременно, чтобы пустили на аттракцион?
      - Соедините два сравнения словом and — рост не меньше 120 и не больше 190.
      - 'Пример: if t >= 18 and t <= 24: print("комфортно")'
    tests:
      - description: 135 см
        input: { height: 135 }
        expected: можно
        visible: true
      - description: Ниже нормы
        input: { height: 110 }
        expected: нельзя
      - description: Ровно 120
        input: { height: 120 }
        expected: можно
      - description: Выше нормы
        input: { height: 195 }
        expected: нельзя

  - slug: t3
    title: Оценка за тест
    difficulty: medium
    mode: stdout
    description: |
      Переведите баллы за тест в оценку: от 90 — `5`, от 75 — `4`, от 50 — `3`, меньше 50 — `2`.

      **Что уже есть:** переменная `score` (от 0 до 100).

      **Пример:** при `score = 82` вывод:

      ```text
      4
      ```

      **Как проверим:** подставим баллы из каждого диапазона и на границах.
    starter: |
      score = 82  # при проверке подставим другие баллы
      # Выведите оценку
    solution: |
      if score >= 90:
          print(5)
      elif score >= 75:
          print(4)
      elif score >= 50:
          print(3)
      else:
          print(2)
    hints:
      - С какой оценки удобнее начинать проверку — с высокой или с низкой?
      - Идите сверху вниз — if для 90, elif для 75 и 50, else для двойки.
      - 'Пример: if t >= 30: print("жарко") elif t >= 15: print("тепло") else: print("холодно")'
    tests:
      - description: 82 балла
        input: { score: 82 }
        expected: 4
        visible: true
      - description: Ровно 90
        input: { score: 90 }
        expected: 5
      - description: Ровно 50
        input: { score: 50 }
        expected: 3
      - description: 12 баллов
        input: { score: 12 }
        expected: 2

  - slug: t4
    title: Время суток
    difficulty: medium
    mode: stdout
    description: |
      По часу `hour` (от 0 до 23) выведите время суток: 0–5 — `ночь`, 6–11 — `утро`, 12–17 — `день`, 18–23 — `вечер`.

      **Что уже есть:** переменная `hour`.

      **Пример:** при `hour = 14` вывод:

      ```text
      день
      ```

      **Как проверим:** подставим часы из всех промежутков, включая границы.
    starter: |
      hour = 14  # при проверке подставим другой час
      # Выведите время суток
    solution: |
      if hour < 6:
          print("ночь")
      elif hour < 12:
          print("утро")
      elif hour < 18:
          print("день")
      else:
          print("вечер")
    hints:
      - Если проверять промежутки по порядку, нужна ли каждый раз нижняя граница?
      - Цепочка if / elif / elif / else с условиями hour < 6, hour < 12, hour < 18.
      - 'Возрастные группы: if age < 7: … elif age < 18: … else: …'
    tests:
      - description: 14 часов
        input: { hour: 14 }
        expected: день
        visible: true
      - description: Полночь
        input: { hour: 0 }
        expected: ночь
      - description: Граница утра
        input: { hour: 6 }
        expected: утро
      - description: 23 часа
        input: { hour: 23 }
        expected: вечер

  - slug: t5
    title: Существует ли треугольник
    difficulty: hard
    mode: stdout
    description: |
      Треугольник со сторонами `a`, `b`, `c` существует, если каждая сторона меньше суммы двух других. Выведите `да` или `нет`.

      **Что уже есть:** переменные `a`, `b`, `c`.

      **Пример:** при сторонах 3, 4, 5 вывод:

      ```text
      да
      ```

      **Как проверим:** подставим подходящие и неподходящие тройки, в том числе «вырожденную» 1, 2, 3.
    starter: |
      a = 3  # при проверке подставим другие стороны
      b = 4
      c = 5
      # Выведите «да» или «нет»
    solution: |
      if a < b + c and b < a + c and c < a + b:
          print("да")
      else:
          print("нет")
    hints:
      - Сколько условий должно выполняться одновременно?
      - Три сравнения, соединённые and — a < b + c, b < a + c, c < a + b.
      - 'Пример: if 0 <= x and x <= 10 and x != 5: print("подходит")'
    tests:
      - description: 3, 4, 5
        input: { a: 3, b: 4, c: 5 }
        expected: да
        visible: true
      - description: Слишком длинная сторона
        input: { a: 1, b: 2, c: 10 }
        expected: нет
      - description: Вырожденный случай
        input: { a: 1, b: 2, c: 3 }
        expected: нет
      - description: Равносторонний
        input: { a: 7, b: 7, c: 7 }
        expected: да

  - slug: t6
    title: Високосный год
    difficulty: hard
    mode: stdout
    description: |
      Год високосный, если он делится на 4, но не делится на 100, **или** если он делится на 400. Выведите `високосный` или `обычный`.

      **Что уже есть:** переменная `year`.

      **Пример:** при `year = 2024` вывод:

      ```text
      високосный
      ```

      **Как проверим:** подставим 2024, 1900, 2000 и 2023 — каждый проверяет свою часть правила.
    starter: |
      year = 2024  # при проверке подставим другой год
      # Выведите «високосный» или «обычный»
    solution: |
      if (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:
          print("високосный")
      else:
          print("обычный")
    hints:
      - Из каких двух частей состоит правило и как они связаны между собой?
      - Первая часть — делится на 4 и не делится на 100 (and). Вторая — делится на 400. Части соединяет or, первую возьмите в скобки.
      - 'Пример: if (x > 0 and x % 2 == 0) or x == -1: print("подходит")'
    tests:
      - description: 2024 год
        input: { year: 2024 }
        expected: високосный
        visible: true
      - description: 1900 — делится на 100
        input: { year: 1900 }
        expected: обычный
      - description: 2000 — делится на 400
        input: { year: 2000 }
        expected: високосный
      - description: 2023 год
        input: { year: 2023 }
        expected: обычный
